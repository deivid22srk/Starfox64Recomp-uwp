name: Build Android APK

on:
  push:
    branches:
      - uwp-compat
      - 'android/**'
  pull_request:
    branches: [ uwp-compat ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init required submodules
        run: |
          git submodule update --init --recursive \
            lib/N64ModernRuntime
          git submodule update --init \
            lib/rt64 \
            lib/RmlUi \
            lib/lunasvg \
            lib/sse2neon \
            lib/freetype-windows-binaries
          git submodule update --init --recursive \
            lib/rt64
          git submodule update --init --recursive \
            thirdparty/libadrenotools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Clone SDL2
        run: |
          git clone --branch release-2.30.3 --depth 1 https://github.com/libsdl-org/SDL.git lib/SDL2
          sed -i 's/ALooper_pollAll/ALooper_pollOnce/g' lib/SDL2/src/sensor/android/SDL_androidsensor.c

      - name: Apply submodule patches
        run: |
          git -C lib/N64ModernRuntime apply $GITHUB_WORKSPACE/ci/patches/n64modernruntime.patch
          git -C lib/rt64 apply $GITHUB_WORKSPACE/ci/patches/rt64.patch
          git -C lib/rt64 apply $GITHUB_WORKSPACE/ci/patches/rt64-android-no-dual-source.patch
          git -C lib/rt64/src/contrib/plume apply $GITHUB_WORKSPACE/ci/patches/plume.patch
          git -C lib/rt64/src/contrib/plume apply $GITHUB_WORKSPACE/ci/patches/plume-android-capabilities.patch


      - name: Configure CMake
        run: |
          cmake -B android-build \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_SDK_ROOT}/ndk/27.0.12077973/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -S .
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Build native libraries
        run: cmake --build android-build -j$(nproc)

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Starfox64Recomp-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
